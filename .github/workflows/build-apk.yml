name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk MorningBrief.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MorningBrief-apk
          path: MorningBrief.apk
      # 휴대폰에서 바로 받을 수 있도록 "Releases"에 APK 올리기
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 모닝 브리핑 최신 APK
          body: 아래 MorningBrief.apk 를 휴대폰에서 눌러 내려받아 설치하세요.
          files: MorningBrief.apk
          make_latest: true
